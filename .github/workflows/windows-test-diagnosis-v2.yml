name: Windows test diagnosis v2

on:
  push:
    branches: [ci/windows-test-diagnosis-v2]

permissions:
  contents: read

jobs:
  test-files:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test files one at a time
        run: node --import tsx scripts/run-test-files.ts
