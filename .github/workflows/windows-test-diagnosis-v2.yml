name: Windows test diagnosis v2

on:
  push:
    branches: [ci/windows-test-diagnosis-v2]

permissions:
  contents: read

jobs:
  test-files:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise native ACL helper
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'patchpaw-acl-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $sid = ((whoami /user | Select-String -Pattern 'S-\d-\d+(?:-\d+)+').Matches.Value)
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows/protect-acl.ps1 $probe $sid set directory
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows/protect-acl.ps1 $probe '' verify directory

      - name: Run test files one at a time
        run: node --import tsx scripts/run-test-files.ts
